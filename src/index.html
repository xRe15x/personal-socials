<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal socials & gaming site</title>
    <link rel="stylesheet" href="./style.css">
    <script defer src="./index.ts"></script>
</head>
<body>
    <div class="container middle-bg">
        <div id="left">
            <div class="left-bg-transition"></div>
            <div id="social-media" class="link-list">
                <ul class="link-list-container"></ul>
            </div>
        </div>

        <div id="middle">
            <div class="middle-top-container">
                <p id="about-me-1" class="text-block">About me 1</p>
            </div>

            <div class="middle-middle-container">
                <h1>Title</h1>
            </div>

            <div class="middle-bottom-container">
                <p id="about-me-2" class="text-block">About me 2</p>
            </div>
        </div>

        <div id="right">
            <div class="right-bg-transition"></div>
            <div class="games-container">
                <div id="games" class="link-list">
                    <ul class="link-list-container"></ul>
                </div>
            </div>
            
            <div class="fav-games-container">
                <p id="fav-games" class="text-block">My favourite games are...</p>
            </div>
        </div>
    </div>
</body>
</html>
