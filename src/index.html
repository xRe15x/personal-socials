<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal socials & gaming site</title>
    <link rel="stylesheet" href="./style.css">
    <script defer src="./index.ts"></script>
</head>
<body>
    <div class="container middle-bg">
        <div class="left">
            <ul id="social-media" class="link-list">
                <li>
                    <a href="#" class="list-a">
                        <img class="link-img" src="./images/social-media/logos/discord.png" alt="discord logo">
                        <span class="link-text">Discord</span>
                    </a>
                </li>

                <li>
                    <a href="#" class="list-a">
                        <img class="link-img" src="./images/social-media/logos/instagram.png" alt="instagram logo">
                        <span class="link-text">Instagram</span>
                    </a>
                </li>

                <li>
                    <a href="#" class="list-a">
                        <img class="link-img" src="./images/social-media/logos/tiktok.png" alt="tiktok logo">
                        <span class="link-text">Tiktok</span>
                    </a>
                </li>
            </ul>
        </div>

        <div class="middle"></div>

        <div class="right">
            <div class="games-container">
                <ul id="games" class="link-list">
                    <li>
                        <a href="#" class="list-a">
                            <span class="link-text">Discord</span>
                            <img class="link-img" src="./images/social-media/logos/discord.png" alt="discord logo">
                        </a>
                    </li>

                    <li>
                        <a href="#" class="list-a">
                            <span class="link-text">Instagram</span>
                            <img class="link-img" src="./images/social-media/logos/instagram.png" alt="instagram logo">
                        </a>
                    </li>

                    <li>
                        <a href="#" class="list-a">
                            <span class="link-text">Tiktok</span>
                            <img class="link-img" src="./images/social-media/logos/tiktok.png" alt="tiktok logo">
                        </a>
                    </li>
                </ul>
            </div>
            
            <div class="fav-games-container">
                <p id="fav-games">Lorem ipsum dolor sit am</p>
            </div>
        </div>
    </div>
</body>
</html>
