<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal socials & gaming site</title>
    <link rel="stylesheet" href="./style.css">
    <script defer src="./index.ts"></script>
</head>
<body>
    <div class="container middle-bg">
        <div id="left">
            <ul id="social-media" class="link-list">
                <li>
                    <a href="#" class="list-a">
                        <img class="link-img" src="./images/social-media/logos/discord.png" alt="discord logo">
                        <span class="link-text">Discord</span>
                    </a>
                </li>
            </ul>
        </div>

        <div id="middle">
            <div class="middle-top-container">
                <p id="about-me-1" class="text-block">About me 1</p>
            </div>

            <div class="middle-middle-container">
                <h1>Title</h1>
            </div>

            <div class="middle-bottom-container">
                <p id="about-me-2" class="text-block">About me 2</p>
            </div>
        </div>

        <div id="right">
            <div class="games-container">
                <ul id="games" class="link-list">
                    <li>
                        <a href="#" class="list-a">
                            <span class="link-text">Discord</span>
                            <img class="link-img" src="./images/social-media/logos/discord.png" alt="discord logo">
                        </a>
                    </li>
                </ul>
            </div>
            
            <div class="fav-games-container">
                <p id="fav-games" class="text-block">My favourite games are...</p>
            </div>
        </div>
    </div>
</body>
</html>
